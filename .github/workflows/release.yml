name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, for example v2.0.1'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Derive the version from the tag
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:TAG
          if ($tag -notmatch '^v(?<version>[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?)$') {
            throw "Tag '$tag' must look like v2.0.1 (semantic version with a leading v)."
          }
          "version=$($Matches.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Releasing version $($Matches.version)"

      - name: Build packages and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:RUNNER_TEMP 'dist'
          ./BuildRelease.ps1 -Version '${{ steps.version.outputs.version }}' -OutputDir $dist
          if ($LASTEXITCODE -ne 0) { throw 'BuildRelease.ps1 failed.' }

          $lines = Get-ChildItem -LiteralPath $dist -Filter *.zip | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -LiteralPath (Join-Path $dist 'SHA256SUMS.txt') -Encoding ascii
          Get-ChildItem -LiteralPath $dist | Select-Object Name, Length

      - name: Verify the portable package layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = Join-Path $env:RUNNER_TEMP "dist/FastDownloader-${{ steps.version.outputs.version }}.zip"
          $expanded = Join-Path $env:RUNNER_TEMP 'expanded'
          Expand-Archive -LiteralPath $portable -DestinationPath $expanded
          foreach ($required in 'FastDownload.ps1', 'StartDownload.cmd', 'bin\aria2c.exe', 'LICENSE', 'THIRD_PARTY.md') {
            if (-not (Test-Path -LiteralPath (Join-Path $expanded $required))) { throw "Portable package is missing $required" }
          }
          foreach ($forbidden in 'state', 'downloads', 'test-output', 'cookies.txt') {
            if (Test-Path -LiteralPath (Join-Path $expanded $forbidden)) { throw "Portable package must not contain $forbidden" }
          }

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:RUNNER_TEMP 'dist'
          $assets = @(Get-ChildItem -LiteralPath $dist -File | Select-Object -ExpandProperty FullName)
          gh release view $env:TAG 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $assets --clobber
          } else {
            gh release create $env:TAG $assets --title "FastDownloader $env:TAG" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the release failed.' }
